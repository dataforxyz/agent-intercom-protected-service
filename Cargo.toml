[package]
name = "agent-intercom-protected-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Inert validation contracts for the future Agent Intercom protected-service boundary"
license = "AGPL-3.0-only"
repository = "https://github.com/dataforxyz/agent-intercom-protected-service"
publish = false
build = false
autobins = false
autoexamples = false
autobenches = false
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/data/**",
  "/docs/ARCHITECTURE.md",
  "/docs/DEPENDENCIES.md",
  "/docs/REPRODUCIBILITY.md",
  "/docs/TRUST.md",
  "/index.d.ts",
  "/package.json",
  "/rust-toolchain.toml",
  "/schemas/**",
  "/src/**",
  "/tests/**",
]

[lib]
path = "src/lib.rs"
